version: '3.8'

services:
  taskflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:../db/custom.db
      - JWT_SECRET=taskflow-docker-production-secret-jwt-key
      - NODE_ENV=production
    volumes:
      - ./db:/app/db
